name: Build & Publish Resume

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; let a newer push supersede an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc, WeasyPrint, and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            fonts-liberation \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi-dev libjpeg-dev libopenjp2-7
          pipx install weasyprint

      - name: Build PDF, DOCX, and HTML
        run: make all

      - name: Upload downloadable artifacts (PDF + DOCX)
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: |
            dist/geoff-scott-resume.pdf
            dist/geoff-scott-resume.docx

      - name: Package site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
